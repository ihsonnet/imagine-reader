# Run Imagine-Reader on your computer:  docker compose up -d   then open http://localhost:8000
#
# Your key comes from .env (copy .env.example). It is passed to the containers when they start and never copied
# into the image. Your books, their voice, and their pictures live in the "data" volume. The port is bound to
# this computer only.

x-app: &app
  build: .
  image: imagine-reader:local
  env_file:
    - path: .env
      required: false
  environment:
    IR_UPLOADS: ${IR_UPLOADS:-true} # false for a public demo of the samples only
    IR_CLIENT_IP_HEADER: ${IR_CLIENT_IP_HEADER:-}
  volumes:
    - data:/data
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      - "127.0.0.1:${IR_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    <<: *app
    command: ["python", "-m", "imagine_reader_server.worker"]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s # lets a running job finish

volumes:
  data:
