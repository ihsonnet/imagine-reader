name: Bug report
description: Something in the reader, the server, or the engine does not work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots and error messages help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a sample book
        2. Press Play
        3. ...
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - imagine-reader.ihsonnet.com
        - My own installation (Docker)
        - My own installation (development setup)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For your own installation, any relevant server or browser console output. Remove any keys first.
      render: text
