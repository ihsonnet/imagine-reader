name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Engine and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            server/pyproject.toml
      - run: pip install -e "engine[dev]" -e "server[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest engine server

  reader:
    name: Reader
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reader/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
